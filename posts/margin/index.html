document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ent-color:#1DE9C6}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<nav style=\"position:sticky;top:0;z-index:60;background:rgba(10,10,12,.82);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px\">\n    <a href=\"#top\" style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:23px;color:#EDECE6\">Margin<\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:26px;font-family:'Red Hat Mono',monospace;font-size:12.5px\">\n      <a href=\"#row-a\" style=\"color:#A9A8B2\" style-hover=\"color:#1DE9C6\">Demos<\u002Fa>\n      <a href=\"#usecases\" style=\"color:#A9A8B2\" style-hover=\"color:#1DE9C6\">Use cases<\u002Fa>\n      <a href=\"#faq\" style=\"color:#A9A8B2\" style-hover=\"color:#1DE9C6\">FAQ<\u002Fa>\n      <a href=\"#cta\" style=\"background:#1DE9C6;color:#06231D;font-family:'Public Sans',sans-serif;font-weight:600;font-size:13.5px;padding:9px 18px;border-radius:6px\" style-hover=\"filter:brightness(1.12);color:#06231D\">Book a pilot<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<section id=\"top\" data-screen-label=\"Hero\" style=\"padding:120px 0 96px;background:radial-gradient(900px 480px at 72% -12%, rgba(29,233,198,.08), transparent 70%)\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 28px\">\n    <h1 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(52px,7.6vw,96px);line-height:.98;margin:0;max-width:12ch;text-wrap:balance\">Select anything. <em style=\"color:#1DE9C6\">Understand<\u002Fem> everything.<\u002Fh1>\n    <p style=\"font-size:18px;line-height:1.65;color:#A9A8B2;max-width:56ch;margin:28px 0 36px\">Margin turns any equation, circuit, or figure — in any textbook, PDF, or app — into a verified, animated, checkpoint-driven explanation. One SDK call.<\u002Fp>\n    <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n      <a href=\"#row-a\" style=\"background:#1DE9C6;color:#06231D;font-weight:600;font-size:15px;padding:14px 28px;border-radius:6px\" style-hover=\"filter:brightness(1.12);color:#06231D\">See it think<\u002Fa>\n      <a href=\"#embed\" style=\"border:1px solid rgba(255,255,255,.22);color:#EDECE6;font-weight:500;font-size:15px;padding:13px 28px;border-radius:6px\" style-hover=\"border-color:#1DE9C6;color:#1DE9C6\">Read the docs<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:56px;flex-wrap:wrap;margin-top:76px;border-top:1px solid rgba(255,255,255,.07);padding-top:36px\">\n      <div style=\"flex:0 1 auto\"><div style=\"font-family:'Red Hat Mono',monospace;font-size:38px;color:#1DE9C6\">{{ c1 }}%<\u002Fdiv><div style=\"font-size:13px;color:#8A8A93;max-width:24ch;margin-top:6px\">solver-verified, never hallucinated math<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:0 1 auto\"><div style=\"font-family:'Red Hat Mono',monospace;font-size:38px;color:#1DE9C6\">{{ c2 }}<\u002Fdiv><div style=\"font-size:13px;color:#8A8A93;max-width:22ch;margin-top:6px\">API call to embed<\u002Fdiv><\u002Fdiv>\n      <div style=\"flex:0 1 auto\"><div style=\"font-family:'Red Hat Mono',monospace;font-size:38px;color:#1DE9C6\">{{ c3 }}<\u002Fdiv><div style=\"font-size:13px;color:#8A8A93;max-width:30ch;margin-top:6px\">domains: algebra, calculus, physics, circuits, statistics, CS<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"row-a\" data-screen-label=\"Ink to intuition\" style=\"padding:96px 0;border-top:1px solid rgba(255,255,255,.05);animation:rise 1s ease both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 28px;display:flex;flex-wrap:wrap;gap:64px;align-items:center\">\n    <div style=\"flex:1 1 340px;min-width:300px\">\n      <div style=\"font-family:'Red Hat Mono',monospace;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:#6E6E78\">01 · Select<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,46px);line-height:1.05;margin:14px 0 18px\">From ink to intuition.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#A9A8B2;max-width:52ch;text-wrap:pretty\">A student selects y&nbsp;=&nbsp;eˣ with a stylus. A canvas opens over the page and the curve draws itself — then hands the student the controls. Change the base, watch the shape respond, notice what never moves.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 460px;min-width:320px\">\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:12px;overflow:hidden\">\n        <div style=\"margin:18px 18px 0;background:#F5F2EA;color:#1B1B22;border-radius:8px;padding:16px 20px 14px\">\n          <p style=\"font-family:Georgia,'Times New Roman',serif;font-size:13px;line-height:1.55;margin:0;color:#3A3A40\">The exponential function is its own derivative: at every point, the slope of the curve equals its height. This property makes it the natural base for modeling growth.<\u002Fp>\n          <div style=\"text-align:center;padding:10px 0 4px\">\n            <span style=\"position:relative;display:inline-block;font-family:'Caveat',cursive;font-size:34px;font-weight:600;color:#14141A;padding:0 4px\">\n              <span style=\"position:absolute;left:-5px;top:0;bottom:2px;width:0;background:rgba(29,233,198,.32);border-radius:4px;animation:sweep 5.5s 1s ease-in-out infinite\"><\u002Fspan>\n              <span style=\"position:relative\">y = eˣ<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:16px 18px 6px;position:relative\">\n          <span style=\"position:absolute;left:7.5%;top:24px;font-family:'Red Hat Mono',monospace;font-size:15px;color:#1DE9C6\">{{ eqLabel }}<\u002Fspan>\n          <svg sc-camel-view-box=\"0 0 340 214\" style=\"width:100%;display:block\">\n            <line x1=\"16\" y1=\"200\" x2=\"332\" y2=\"200\" stroke=\"#2A2A32\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"151.6\" y1=\"12\" x2=\"151.6\" y2=\"200\" stroke=\"#2A2A32\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"16\" y1=\"{{ py1 }}\" x2=\"332\" y2=\"{{ py1 }}\" stroke=\"#2A2A32\" stroke-width=\"1\" stroke-dasharray=\"3 5\"><\u002Fline>\n            <path d=\"{{ curveD }}\" fill=\"none\" stroke=\"#1DE9C6\" stroke-width=\"2.5\" stroke-linecap=\"round\" sc-camel-path-length=\"1\" style=\"stroke-dasharray:1;animation:drawIn 1.6s .4s ease both\"><\u002Fpath>\n            <circle cx=\"151.6\" cy=\"{{ py1 }}\" r=\"7\" fill=\"rgba(29,233,198,.18)\"><\u002Fcircle>\n            <circle cx=\"151.6\" cy=\"{{ py1 }}\" r=\"3.4\" fill=\"#1DE9C6\"><\u002Fcircle>\n            <text x=\"160\" y=\"{{ pointLabelY }}\" font-family=\"'Red Hat Mono',monospace\" font-size=\"11\" fill=\"#1DE9C6\">(0, 1)<\u002Ftext>\n          <\u002Fsvg>\n          <div style=\"display:flex;align-items:center;gap:14px;padding:8px 4px 12px\">\n            <span style=\"font-family:'Red Hat Mono',monospace;font-size:12.5px;color:#8A8A93;white-space:nowrap\">b = {{ bReadout }}<\u002Fspan>\n            <input type=\"range\" min=\"1.5\" max=\"10\" step=\"0.05\" value=\"{{ bVal }}\" sc-camel-on-change=\"{{ setB }}\" style=\"flex:1;width:100%;cursor:pointer\">\n            <span style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#55555E\">10<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:12.5px;color:#8A8A93;margin:0 4px 12px\">The point (0, 1) never moves — b⁰ = 1 for every base.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #1f1f26;padding:12px 18px;display:flex;align-items:center;gap:8px\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:#1DE9C6;animation:pulseDot 2.4s infinite\"><\u002Fspan>\n          <span style=\"font-family:'Red Hat Mono',monospace;font-size:11.5px;color:#8A8A93\">Live demo — drag the base.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"row-b\" data-screen-label=\"Solves with you\" style=\"padding:96px 0;border-top:1px solid rgba(255,255,255,.05);animation:rise 1s ease both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 28px;display:flex;flex-wrap:wrap;gap:64px;align-items:center\">\n    <div style=\"flex:1 1 460px;min-width:320px\">\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:12px;overflow:hidden\">\n        <svg sc-camel-view-box=\"0 0 360 200\" style=\"width:100%;display:block;padding:14px 8px 0;box-sizing:border-box\">\n          <path ref=\"{{ loopRef }}\" d=\"M30,100 V30 H115 l8,-14 l14,28 l14,-28 l14,28 l8,-14 H310 V70 l14,8 l-28,14 l28,14 l-28,14 l14,8 V170 H30 Z\" fill=\"none\" stroke=\"none\"><\u002Fpath>\n          <path d=\"M30,88 V30 H115 M173,30 H310 V70 M310,128 V170 H30 V112\" fill=\"none\" stroke=\"#3A3A44\" stroke-width=\"2\"><\u002Fpath>\n          <path d=\"M115,30 l8,-14 l14,28 l14,-28 l14,28 l8,-14\" fill=\"none\" stroke=\"#3A3A44\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath>\n          <path d=\"M310,70 l14,8 l-28,14 l28,14 l-28,14 l14,8\" fill=\"none\" stroke=\"{{ r2Stroke }}\" stroke-width=\"{{ r2Width }}\" stroke-linejoin=\"round\"><\u002Fpath>\n          <line x1=\"16\" y1=\"88\" x2=\"44\" y2=\"88\" stroke=\"#8A8A93\" stroke-width=\"2.5\"><\u002Fline>\n          <line x1=\"23\" y1=\"112\" x2=\"37\" y2=\"112\" stroke=\"#8A8A93\" stroke-width=\"4\"><\u002Fline>\n          <text x=\"52\" y=\"92\" font-family=\"'Red Hat Mono',monospace\" font-size=\"10\" fill=\"#55555E\">+<\u002Ftext>\n          <text x=\"52\" y=\"116\" font-family=\"'Red Hat Mono',monospace\" font-size=\"10\" fill=\"#55555E\">−<\u002Ftext>\n          <text x=\"52\" y=\"104\" font-family=\"'Red Hat Mono',monospace\" font-size=\"12\" fill=\"#8A8A93\">12 V<\u002Ftext>\n          <text x=\"144\" y=\"10\" text-anchor=\"middle\" font-family=\"'Red Hat Mono',monospace\" font-size=\"12\" fill=\"#8A8A93\">4 Ω<\u002Ftext>\n          <text x=\"356\" y=\"60\" text-anchor=\"end\" font-family=\"'Red Hat Mono',monospace\" font-size=\"12\" fill=\"#8A8A93\">6 Ω<\u002Ftext>\n          <sc-if value=\"{{ s3on }}\" hint-placeholder-val=\"{{ false }}\">\n            <text x=\"356\" y=\"148\" text-anchor=\"end\" font-family=\"'Red Hat Mono',monospace\" font-size=\"12\" fill=\"#1DE9C6\">7.2 V<\u002Ftext>\n          <\u002Fsc-if>\n          <g ref=\"{{ dotsRef }}\">\n            <circle r=\"2.6\" fill=\"#1DE9C6\" cx=\"-10\" cy=\"-10\"><\u002Fcircle><circle r=\"2.6\" fill=\"#1DE9C6\" cx=\"-10\" cy=\"-10\"><\u002Fcircle><circle r=\"2.6\" fill=\"#1DE9C6\" cx=\"-10\" cy=\"-10\"><\u002Fcircle><circle r=\"2.6\" fill=\"#1DE9C6\" cx=\"-10\" cy=\"-10\"><\u002Fcircle><circle r=\"2.6\" fill=\"#1DE9C6\" cx=\"-10\" cy=\"-10\"><\u002Fcircle><circle r=\"2.6\" fill=\"#1DE9C6\" cx=\"-10\" cy=\"-10\"><\u002Fcircle><circle r=\"2.6\" fill=\"#1DE9C6\" cx=\"-10\" cy=\"-10\"><\u002Fcircle><circle r=\"2.6\" fill=\"#1DE9C6\" cx=\"-10\" cy=\"-10\"><\u002Fcircle>\n          <\u002Fg>\n        <\u002Fsvg>\n        <div style=\"border-top:1px solid #1f1f26;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline\">\n            <span style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#55555E\">01<\u002Fspan>\n            <div>\n              <div style=\"font-size:14px;font-weight:600\">Total resistance<\u002Fdiv>\n              <div style=\"font-family:'Red Hat Mono',monospace;font-size:13px;color:#C9C8D0;margin-top:3px\">R = 4 + 6 = 10 Ω<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ s1active }}\" hint-placeholder-val=\"{{ false }}\">\n            <div><button sc-camel-on-click=\"{{ ck1 }}\" style=\"background:rgba(29,233,198,.08);border:1px solid rgba(29,233,198,.4);color:#1DE9C6;font-family:'Red Hat Mono',monospace;font-size:12.5px;padding:8px 16px;border-radius:999px;cursor:pointer\" style-hover=\"background:rgba(29,233,198,.18)\">Makes sense → Continue<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ s2on }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:12px;align-items:baseline;border-top:1px solid #1a1a20;padding-top:12px\">\n              <span style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#55555E\">02<\u002Fspan>\n              <div>\n                <div style=\"font-size:14px;font-weight:600\">Current<\u002Fdiv>\n                <div style=\"font-family:'Red Hat Mono',monospace;font-size:13px;color:#C9C8D0;margin-top:3px\">I = V / R = 12 / 10 = 1.2 A<\u002Fdiv>\n                <div style=\"font-size:12px;color:#8A8A93;margin-top:3px\">— the flow above just sped up to match.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ s2active }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:rgba(29,233,198,.05);border:1px solid rgba(29,233,198,.3);border-radius:10px;padding:14px 16px\">\n              <div style=\"font-family:'Red Hat Mono',monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#1DE9C6;margin-bottom:8px\">✦ Checkpoint<\u002Fdiv>\n              <div style=\"font-size:14px;margin-bottom:12px\">Predict the voltage across the 6 Ω resistor.<\u002Fdiv>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ predict72 }}\" style=\"{{ p72Style }}\">7.2 V<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ predict48 }}\" style=\"{{ p48Style }}\">4.8 V<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ predWrong }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"font-size:12.5px;line-height:1.55;color:#A9A8B2;margin:12px 0 0\">Not quite — 4.8 V is the drop across the 4 Ω resistor. The larger resistance takes the larger share. Try again.<\u002Fp>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ predRight }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"font-size:12.5px;line-height:1.55;color:#1DE9C6;margin:12px 0 0\">Correct — larger resistor, larger share of the voltage.<\u002Fp>\n                <div style=\"margin-top:10px\"><button sc-camel-on-click=\"{{ toStep3 }}\" style=\"background:rgba(29,233,198,.08);border:1px solid rgba(29,233,198,.4);color:#1DE9C6;font-family:'Red Hat Mono',monospace;font-size:12.5px;padding:8px 16px;border-radius:999px;cursor:pointer\" style-hover=\"background:rgba(29,233,198,.18)\">Continue →<\u002Fbutton><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ s3on }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:12px;align-items:baseline;border-top:1px solid #1a1a20;padding-top:12px\">\n              <span style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#55555E\">03<\u002Fspan>\n              <div>\n                <div style=\"font-size:14px;font-weight:600\">Voltage across 6 Ω <span style=\"color:#1DE9C6\">· highlighted above<\u002Fspan><\u002Fdiv>\n                <div style=\"font-family:'Red Hat Mono',monospace;font-size:13px;color:#C9C8D0;margin-top:3px\">V = I·R = 1.2 × 6 = 7.2 V<\u002Fdiv>\n                <div style=\"margin-top:10px\"><button sc-camel-on-click=\"{{ resetCircuit }}\" style=\"background:none;border:none;color:#8A8A93;font-family:'Red Hat Mono',monospace;font-size:12px;cursor:pointer;padding:0;text-decoration:underline\" style-hover=\"color:#1DE9C6\">↺ Replay demo<\u002Fbutton><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #1f1f26;padding:12px 18px;display:flex;align-items:center;gap:8px\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:#1DE9C6;animation:pulseDot 2.4s infinite\"><\u002Fspan>\n          <span style=\"font-family:'Red Hat Mono',monospace;font-size:11.5px;color:#8A8A93\">Live demo — answer the checkpoint.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 340px;min-width:300px\">\n      <div style=\"font-family:'Red Hat Mono',monospace;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:#6E6E78\">02 · Tutor<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,46px);line-height:1.05;margin:14px 0 18px\">It solves <em style=\"color:#1DE9C6\">with<\u002Fem> you, not <em>for<\u002Fem> you.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#A9A8B2;max-width:52ch;text-wrap:pretty\">Margin animates the physical system while it solves, step by step — and pauses at logical milestones to check understanding before continuing. Tutoring, not answer-dumping.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"row-c\" data-screen-label=\"Verified before animated\" style=\"padding:96px 0;border-top:1px solid rgba(255,255,255,.05);animation:rise 1s ease both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 28px;display:flex;flex-wrap:wrap;gap:64px;align-items:center\">\n    <div style=\"flex:1 1 340px;min-width:300px\">\n      <div style=\"font-family:'Red Hat Mono',monospace;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:#6E6E78\">03 · Verify<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,46px);line-height:1.05;margin:14px 0 18px\">Verified before animated.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#A9A8B2;max-width:52ch;text-wrap:pretty\">Every animation is generated from a solution trace validated by symbolic and numeric solvers — SymPy for math, circuit simulation for EE. The language model narrates and teaches. Deterministic engines guarantee correctness.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 460px;min-width:320px\">\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:12px;padding:20px 20px 16px\">\n        <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n          <sc-for list=\"{{ pipeNodes }}\" as=\"node\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <div style=\"{{ node.style }}\">{{ node.label }}<\u002Fdiv>\n              <sc-if value=\"{{ node.hasArrow }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#4A4A54;font-size:13px\">→<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"min-height:34px;margin-top:14px\">\n          <sc-if value=\"{{ verified }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-family:'Red Hat Mono',monospace;font-size:11.5px;color:#1DE9C6;border:1px solid rgba(29,233,198,.4);background:rgba(29,233,198,.07);border-radius:999px;padding:5px 14px;animation:fadeUp .4s ease both\">● verified trace<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"background:#0C0C10;border:1px solid #1a1a20;border-radius:8px;padding:12px 14px;margin-top:8px;height:126px;overflow:hidden\">\n          <sc-for list=\"{{ logShown }}\" as=\"line\" hint-placeholder-count=\"3\">\n            <div style=\"font-family:'Red Hat Mono',monospace;font-size:11.5px;line-height:1.75;color:#77767F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ line.t }}<\u002Fdiv>\n          <\u002Fsc-for>\n          <span style=\"display:inline-block;width:7px;height:13px;background:#1DE9C6;animation:blink 1s step-end infinite;vertical-align:middle\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"author\" data-screen-label=\"Author with it\" style=\"padding:96px 0;border-top:1px solid rgba(255,255,255,.05);animation:rise 1s ease both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 28px\">\n    <div style=\"max-width:720px\">\n      <div style=\"font-family:'Red Hat Mono',monospace;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:#6E6E78\">04 · Author<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,46px);line-height:1.05;margin:14px 0 18px\">Teachers don't just assign it. They author with it.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#A9A8B2;text-wrap:pretty\">Select any figure or problem from existing materials and Margin drafts a classroom-ready interactive — animation, solve steps, checkpoint questions. Teachers edit it like a lesson, not like code: reorder steps, rewrite a checkpoint, choose where to pause, set the pedagogy mode, lock hint depth per class. Ten minutes of prep becomes a reusable, standards-aligned artifact — and every artifact they refine teaches Margin their teaching style.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:12px;margin-top:44px;overflow:hidden\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0\">\n        <div style=\"padding:20px;border-right:1px solid #1f1f26;border-bottom:1px solid #1f1f26\">\n          <div style=\"font-family:'Red Hat Mono',monospace;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:#6E6E78;margin-bottom:4px\">Lesson editor<\u002Fdiv>\n          <div style=\"font-size:14px;font-weight:600;margin-bottom:2px\">Series circuit — Ohm's law<\u002Fdiv>\n          <div style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#55555E;margin-bottom:16px\">generated from p. 214 · fig 6.3<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ editorItems }}\" as=\"it\" hint-placeholder-count=\"4\">\n              <div draggable=\"{{ true }}\" sc-camel-on-drag-start=\"{{ it.onDragStart }}\" sc-camel-on-drag-over=\"{{ it.onDragOver }}\" sc-camel-on-drop=\"{{ it.onDrop }}\" sc-camel-on-drag-end=\"{{ it.onDragEnd }}\" style=\"{{ it.style }}\">\n                <span style=\"color:#55555E;font-size:13px;cursor:grab;user-select:none\">⠿<\u002Fspan>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:13px;color:#EDECE6\">{{ it.label }}<\u002Fdiv>\n                  <div style=\"{{ it.tagStyle }}\">{{ it.tag }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column\">\n                  <button sc-camel-on-click=\"{{ it.up }}\" style=\"background:none;border:none;color:#55555E;cursor:pointer;font-size:9px;padding:2px 5px;line-height:1\" style-hover=\"color:#1DE9C6\">▲<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ it.down }}\" style=\"background:none;border:none;color:#55555E;cursor:pointer;font-size:9px;padding:2px 5px;line-height:1\" style-hover=\"color:#1DE9C6\">▼<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:20px;border-top:1px solid #1a1a20;padding-top:16px\">\n            <button sc-camel-on-click=\"{{ socToggle }}\" style=\"display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;padding:0\">\n              <span style=\"{{ socTrack }}\"><span style=\"{{ socKnob }}\"><\u002Fspan><\u002Fspan>\n              <span style=\"font-size:12.5px;color:#C9C8D0\">Socratic mode<\u002Fspan>\n            <\u002Fbutton>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font-size:12.5px;color:#C9C8D0\">Hint depth<\u002Fspan>\n              <div style=\"display:flex;background:#0E0E12;border:1px solid #232329;border-radius:8px;padding:3px;gap:2px\">\n                <sc-for list=\"{{ hintOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px;border-bottom:1px solid #1f1f26;background:#0C0C10\">\n          <div style=\"font-family:'Red Hat Mono',monospace;font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:#6E6E78;margin-bottom:4px\">Student preview<\u002Fdiv>\n          <div style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#55555E;margin-bottom:16px\">updates live as you edit<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ previewItems }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"{{ p.style }}\">\n                <div style=\"font-size:12.5px;line-height:1.5\">{{ p.label }}<\u002Fdiv>\n                <sc-if value=\"{{ p.hint }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#1DE9C6;margin-top:6px\">{{ p.hint }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ p.note }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-family:'Red Hat Mono',monospace;font-size:10.5px;color:#55555E;margin-top:6px\">{{ p.note }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:12px 18px;display:flex;align-items:center;gap:8px\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#1DE9C6;animation:pulseDot 2.4s infinite\"><\u002Fspan>\n        <span style=\"font-family:'Red Hat Mono',monospace;font-size:11.5px;color:#8A8A93\">Live demo — drag a checkpoint, flip a mode.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"embed\" data-screen-label=\"One line any content\" style=\"padding:96px 0;border-top:1px solid rgba(255,255,255,.05);animation:rise 1s ease both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 28px;display:flex;flex-wrap:wrap;gap:64px;align-items:center\">\n    <div style=\"flex:1 1 460px;min-width:320px\">\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:12px;overflow:hidden\">\n        <div style=\"display:flex;border-bottom:1px solid #1f1f26\">\n          <sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ tb.onClick }}\" style=\"{{ tb.style }}\">{{ tb.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#0C0C10;padding:16px 0;overflow-x:auto;min-height:172px\">\n          <sc-for list=\"{{ codeLines }}\" as=\"l\" hint-placeholder-count=\"5\">\n            <div style=\"{{ l.style }}\"><span style=\"{{ l.gStyle }}\">{{ l.g }}<\u002Fspan>{{ l.t }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #1f1f26;padding:12px 18px;display:flex;align-items:center;gap:8px\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:#1DE9C6;animation:pulseDot 2.4s infinite\"><\u002Fspan>\n          <span style=\"font-family:'Red Hat Mono',monospace;font-size:11.5px;color:#8A8A93\">One added line per platform.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 340px;min-width:300px\">\n      <div style=\"font-family:'Red Hat Mono',monospace;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:#6E6E78\">05 · Embed<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,46px);line-height:1.05;margin:14px 0 18px\">One line. Any content.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#A9A8B2;max-width:52ch;text-wrap:pretty\">Publishers and platforms embed Margin over existing PDFs and HTML. No re-authoring, no migration — the content you already ship becomes interactive where it stands.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"signal\" data-screen-label=\"Every interaction is a signal\" style=\"padding:96px 0;border-top:1px solid rgba(255,255,255,.05);animation:rise 1s ease both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 28px;display:flex;flex-wrap:wrap;gap:64px;align-items:center\">\n    <div style=\"flex:1 1 340px;min-width:300px\">\n      <div style=\"font-family:'Red Hat Mono',monospace;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:#6E6E78\">06 · Measure<\u002Fdiv>\n      <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,46px);line-height:1.05;margin:14px 0 18px\">Every interaction is a signal.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#A9A8B2;max-width:52ch;text-wrap:pretty\">Checkpoint predictions, slider explorations, hesitation time — formative assessment no quiz can capture, flowing to the teacher in real time.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 460px;min-width:320px\">\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:12px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0\">\n          <div style=\"padding:18px;border-right:1px solid #1f1f26;border-bottom:1px solid #1f1f26\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px\">\n              <span style=\"font-family:'Red Hat Mono',monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#6E6E78\">Misconceptions · topic × checkpoint<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ heatRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:5px;margin-bottom:5px\">\n                <span style=\"width:112px;flex-shrink:0;font-family:'Red Hat Mono',monospace;font-size:10px;color:#77767F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ row.label }}<\u002Fspan>\n                <sc-for list=\"{{ row.cells }}\" as=\"c\" hint-placeholder-count=\"6\">\n                  <div style=\"{{ c.style }}\"><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;align-items:center;gap:5px;margin-top:6px\">\n              <span style=\"width:112px;flex-shrink:0\"><\u002Fspan>\n              <span style=\"width:22px;text-align:center;font-family:'Red Hat Mono',monospace;font-size:9px;color:#55555E\">C1<\u002Fspan><span style=\"width:22px;text-align:center;font-family:'Red Hat Mono',monospace;font-size:9px;color:#55555E\">C2<\u002Fspan><span style=\"width:22px;text-align:center;font-family:'Red Hat Mono',monospace;font-size:9px;color:#55555E\">C3<\u002Fspan><span style=\"width:22px;text-align:center;font-family:'Red Hat Mono',monospace;font-size:9px;color:#55555E\">C4<\u002Fspan><span style=\"width:22px;text-align:center;font-family:'Red Hat Mono',monospace;font-size:9px;color:#55555E\">C5<\u002Fspan><span style=\"width:22px;text-align:center;font-family:'Red Hat Mono',monospace;font-size:9px;color:#55555E\">C6<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:18px;border-bottom:1px solid #1f1f26;background:#0C0C10\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px\">\n              <span style=\"font-family:'Red Hat Mono',monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#6E6E78\">Event feed<\u002Fspan>\n              <span style=\"font-family:'Red Hat Mono',monospace;font-size:9.5px;color:#55555E;border:1px solid #232329;border-radius:999px;padding:3px 9px;white-space:nowrap\">Illustrative data<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:168px;overflow:hidden;display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ feedItems }}\" as=\"ev\" hint-placeholder-count=\"4\">\n                <div style=\"{{ ev.style }}\">\n                  <span style=\"font-family:'Red Hat Mono',monospace;font-size:10px;color:#55555E;white-space:nowrap\">{{ ev.time }}<\u002Fspan>\n                  <span style=\"font-size:12px;line-height:1.5;color:#A9A8B2\">{{ ev.t }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"usecases\" data-screen-label=\"Use cases\" style=\"padding:96px 0;border-top:1px solid rgba(255,255,255,.05);animation:rise 1s ease both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 28px\">\n    <div style=\"font-family:'Red Hat Mono',monospace;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:#6E6E78\">From Year 8 to the lab bench<\u002Fdiv>\n    <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,46px);line-height:1.05;margin:14px 0 36px\">The same engine, every level.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px\">\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:10px;padding:18px\"><div style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#6E6E78;margin-bottom:8px\">YEAR 8 · ALGEBRA<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#C9C8D0\">Exponential growth with a live base slider.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:10px;padding:18px\"><div style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#6E6E78;margin-bottom:8px\">YEAR 12 · PHYSICS<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#C9C8D0\">Projectile motion decomposed into animated vectors.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:10px;padding:18px\"><div style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#6E6E78;margin-bottom:8px\">FIRST-YEAR EE<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#C9C8D0\">Series and mesh circuits solved live, current visible.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:10px;padding:18px\"><div style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#6E6E78;margin-bottom:8px\">COMPUTER SCIENCE<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#C9C8D0\">Quicksort's worst case: predict the pivot, then watch it degrade.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:10px;padding:18px\"><div style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#6E6E78;margin-bottom:8px\">STATISTICS<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#C9C8D0\">The central limit theorem as a running sampling simulation.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:10px;padding:18px\"><div style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#6E6E78;margin-bottom:8px\">MEDICAL<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#C9C8D0\">Pharmacokinetics: drug levels moving between compartments.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:10px;padding:18px\"><div style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#6E6E78;margin-bottom:8px\">PHD<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#C9C8D0\">Derivations reconstructed between paper equations, approximation steps flagged.<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#101014;border:1px solid #1f1f26;border-radius:10px;padding:18px\"><div style=\"font-family:'Red Hat Mono',monospace;font-size:11px;color:#6E6E78;margin-bottom:8px\">PROFESSIONAL<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:#C9C8D0\">A Smith chart built live from the datasheet's S-parameters.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"compare\" data-screen-label=\"Comparison\" style=\"padding:96px 0;border-top:1px solid rgba(255,255,255,.05);animation:rise 1s ease both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 28px\">\n    <div style=\"font-family:'Red Hat Mono',monospace;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:#6E6E78\">Margin vs. the alternatives<\u002Fdiv>\n    <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,46px);line-height:1.05;margin:14px 0 36px\">Solvers answer. Chat explains. Margin teaches.<\u002Fh2>\n    <div style=\"overflow-x:auto;border:1px solid #1f1f26;border-radius:12px\">\n      <sc-raw-table style=\"width:100%;min-width:680px;border-collapse:collapse;background:#101014\">\n        <sc-raw-thead>\n          <sc-raw-tr>\n            <sc-raw-th style=\"text-align:left;padding:16px 18px;font-size:12px;font-weight:500;color:#6E6E78;border-bottom:1px solid #1f1f26\"><\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:16px 14px;font-size:13px;font-weight:600;color:#C9C8D0;border-bottom:1px solid #1f1f26\">Photo solvers<div style=\"font-family:'Red Hat Mono',monospace;font-size:10px;font-weight:400;color:#55555E;margin-top:3px\">Photomath-style<\u002Fdiv><\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:16px 14px;font-size:13px;font-weight:600;color:#C9C8D0;border-bottom:1px solid #1f1f26\">OS features<div style=\"font-family:'Red Hat Mono',monospace;font-size:10px;font-weight:400;color:#55555E;margin-top:3px\">Apple Math Notes<\u002Fdiv><\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:16px 14px;font-size:13px;font-weight:600;color:#C9C8D0;border-bottom:1px solid #1f1f26\">Chat AI<div style=\"font-family:'Red Hat Mono',monospace;font-size:10px;font-weight:400;color:#55555E;margin-top:3px\">Gemini, ChatGPT<\u002Fdiv><\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:16px 14px;font-size:15px;font-weight:400;border-bottom:1px solid #1f1f26;font-family:'Instrument Serif',serif;font-style:italic;color:#1DE9C6\">Margin<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:13px 18px;font-size:13.5px;color:#EDECE6;border-bottom:1px solid #1a1a20\">Animated explanation<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E;border-bottom:1px solid #1a1a20\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:12px;color:#8A8A93;border-bottom:1px solid #1a1a20\">Graphs only<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E;border-bottom:1px solid #1a1a20\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:14px;color:#1DE9C6;border-bottom:1px solid #1a1a20\">✓<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:13px 18px;font-size:13.5px;color:#EDECE6;border-bottom:1px solid #1a1a20\">Solver-verified correctness<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:12px;color:#8A8A93;border-bottom:1px solid #1a1a20\">Answers only<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:12px;color:#8A8A93;border-bottom:1px solid #1a1a20\">Arithmetic only<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E;border-bottom:1px solid #1a1a20\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:14px;color:#1DE9C6;border-bottom:1px solid #1a1a20\">✓<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:13px 18px;font-size:13.5px;color:#EDECE6;border-bottom:1px solid #1a1a20\">Checkpoint tutoring loop<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E;border-bottom:1px solid #1a1a20\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E;border-bottom:1px solid #1a1a20\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:12px;color:#8A8A93;border-bottom:1px solid #1a1a20\">Prompt-dependent<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:14px;color:#1DE9C6;border-bottom:1px solid #1a1a20\">✓<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:13px 18px;font-size:13.5px;color:#EDECE6;border-bottom:1px solid #1a1a20\">Works inside existing content<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E;border-bottom:1px solid #1a1a20\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:12px;color:#8A8A93;border-bottom:1px solid #1a1a20\">Notes app only<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E;border-bottom:1px solid #1a1a20\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:14px;color:#1DE9C6;border-bottom:1px solid #1a1a20\">✓<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:13px 18px;font-size:13.5px;color:#EDECE6;border-bottom:1px solid #1a1a20\">Assessment telemetry<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E;border-bottom:1px solid #1a1a20\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E;border-bottom:1px solid #1a1a20\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E;border-bottom:1px solid #1a1a20\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:14px;color:#1DE9C6;border-bottom:1px solid #1a1a20\">✓<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:13px 18px;font-size:13.5px;color:#EDECE6\">Embeddable SDK<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:13px;color:#55555E\">—<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:12px;color:#8A8A93\">API, no UI<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:13px 14px;font-size:14px;color:#1DE9C6\">✓<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" data-screen-label=\"FAQ\" style=\"padding:96px 0;border-top:1px solid rgba(255,255,255,.05);animation:rise 1s ease both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n  <div style=\"max-width:820px;margin:0 auto;padding:0 28px\">\n    <div style=\"font-family:'Red Hat Mono',monospace;font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:#6E6E78\">FAQ<\u002Fdiv>\n    <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,4vw,46px);line-height:1.05;margin:14px 0 24px\">The questions we always get.<\u002Fh2>\n    <div style=\"border-top:1px solid #1f1f26;padding:20px 0\">\n      <button sc-camel-on-click=\"{{ tg0 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:none;color:#EDECE6;cursor:pointer;text-align:left;font-family:'Public Sans',sans-serif;font-size:16.5px;font-weight:600;padding:0\">How is this different from Photomath?<span style=\"font-family:'Red Hat Mono',monospace;color:#1DE9C6;font-size:18px\">{{ ic0 }}<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ fq0 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:14.5px;line-height:1.7;color:#A9A8B2;margin:14px 0 0;max-width:62ch\">Photo solvers return the answer to a photographed problem. Margin instruments the content itself: the equation stays in context, the explanation is animated and paced by checkpoints, and every interaction feeds telemetry back to the teacher. Margin is an SDK, not a destination app.<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #1f1f26;padding:20px 0\">\n      <button sc-camel-on-click=\"{{ tg1 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:none;color:#EDECE6;cursor:pointer;text-align:left;font-family:'Public Sans',sans-serif;font-size:16.5px;font-weight:600;padding:0\">What stops the model from animating wrong physics?<span style=\"font-family:'Red Hat Mono',monospace;color:#1DE9C6;font-size:18px\">{{ ic1 }}<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ fq1 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:14.5px;line-height:1.7;color:#A9A8B2;margin:14px 0 0;max-width:62ch\">The animation is generated from a solution trace, not from language-model output. Traces are produced and checked by deterministic engines — SymPy for symbolic math, numeric circuit simulation for EE — and a trace that fails verification is never animated. The model narrates; it does not compute.<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #1f1f26;padding:20px 0\">\n      <button sc-camel-on-click=\"{{ tg2 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:none;color:#EDECE6;cursor:pointer;text-align:left;font-family:'Public Sans',sans-serif;font-size:16.5px;font-weight:600;padding:0\">Which subjects at launch?<span style=\"font-family:'Red Hat Mono',monospace;color:#1DE9C6;font-size:18px\">{{ ic2 }}<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ fq2 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:14.5px;line-height:1.7;color:#A9A8B2;margin:14px 0 0;max-width:62ch\">Algebra, calculus, physics, circuits, statistics, and computer science. Domain packs share the same trace format, so new subjects ship without SDK changes.<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #1f1f26;padding:20px 0\">\n      <button sc-camel-on-click=\"{{ tg3 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:none;color:#EDECE6;cursor:pointer;text-align:left;font-family:'Public Sans',sans-serif;font-size:16.5px;font-weight:600;padding:0\">Does it just give students answers?<span style=\"font-family:'Red Hat Mono',monospace;color:#1DE9C6;font-size:18px\">{{ ic3 }}<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ fq3 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:14.5px;line-height:1.7;color:#A9A8B2;margin:14px 0 0;max-width:62ch\">No. The default mode pauses at checkpoints and asks the student to predict before revealing. Teachers set the pedagogy per class: reveal steps or Socratic predict-first, with hint depth locked from minimal to worked.<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #1f1f26;border-bottom:1px solid #1f1f26;padding:20px 0\">\n      <button sc-camel-on-click=\"{{ tg4 }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:none;color:#EDECE6;cursor:pointer;text-align:left;font-family:'Public Sans',sans-serif;font-size:16.5px;font-weight:600;padding:0\">How do we embed it?<span style=\"font-family:'Red Hat Mono',monospace;color:#1DE9C6;font-size:18px\">{{ ic4 }}<\u002Fspan><\u002Fbutton>\n      <sc-if value=\"{{ fq4 }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:14.5px;line-height:1.7;color:#A9A8B2;margin:14px 0 0;max-width:62ch\">One call: Margin.attach(document). The SDK overlays existing PDFs, EPUB, and HTML — no re-authoring, no content migration. Native bindings ship for iOS (PencilKit) and the major LMS platforms.<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"cta\" data-screen-label=\"Final CTA\" style=\"padding:130px 0 120px;border-top:1px solid rgba(255,255,255,.05);background:radial-gradient(700px 380px at 50% 120%, rgba(29,233,198,.08), transparent 70%);animation:rise 1s ease both;animation-timeline:view();animation-range:entry 0% entry 30%\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 28px;text-align:center\">\n    <h2 style=\"font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(40px,5.6vw,68px);line-height:1.04;margin:0 auto;max-width:20ch;text-wrap:balance\">Your content is already written. <em style=\"color:#1DE9C6\">Make it move.<\u002Fem><\u002Fh2>\n    <div style=\"display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:40px\">\n      <a href=\"#top\" style=\"background:#1DE9C6;color:#06231D;font-weight:600;font-size:15px;padding:14px 28px;border-radius:6px\" style-hover=\"filter:brightness(1.12);color:#06231D\">Book a pilot<\u002Fa>\n      <a href=\"#row-a\" style=\"border:1px solid rgba(255,255,255,.22);color:#EDECE6;font-weight:500;font-size:15px;padding:13px 28px;border-radius:6px\" style-hover=\"border-color:#1DE9C6;color:#1DE9C6\">Try the sandbox<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top:1px solid rgba(255,255,255,.06);padding:28px 0\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:0 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap\">\n    <span style=\"font-family:'Red Hat Mono',monospace;font-size:12px;color:#55555E\">© 2026 Margin Labs<\u002Fspan>\n    <div style=\"display:flex;gap:22px;font-family:'Red Hat Mono',monospace;font-size:12px\">\n      <a href=\"#embed\" style=\"color:#77767F\" style-hover=\"color:#1DE9C6\">Docs<\u002Fa>\n      <a href=\"#embed\" style=\"color:#77767F\" style-hover=\"color:#1DE9C6\">SDK reference<\u002Fa>\n      <a href=\"#top\" style=\"color:#77767F\" style-hover=\"color:#1DE9C6\">Privacy<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;demoAutoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demos&quot;},&quot;socraticDefault&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Authoring demo&quot;},&quot;hintDefault&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;minimal&quot;,&quot;guided&quot;,&quot;worked&quot;],&quot;default&quot;:&quot;guided&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Authoring demo&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    b: 2.72, step: 1, pred: null, tick: 0, etick: 0, faq: 0, tab: 'web',\n    dragIdx: null, c1: 0, c2: 0, c3: 0,\n    lessonSteps: [\n      { id: 's1', type: 'step', label: 'Animate current at t = 0', pv: 'Current begins to flow — dots trace the loop' },\n      { id: 's2', type: 'step', label: 'Total resistance R = 4 + 6 = 10 Ω', pv: 'R = 4 + 6 = 10 Ω — series resistors add' },\n      { id: 'ck', type: 'checkpoint', label: 'Predict V across the 6 Ω resistor', pv: 'Predict: what is V across the 6 Ω resistor?' },\n      { id: 's3', type: 'step', label: 'Reveal V = I·R = 7.2 V', pv: 'V = 1.2 A × 6 Ω = 7.2 V — resistor highlighted' }\n    ]\n  };\n\n  LOG = [\n    'parsed: series circuit · 2 resistors, 1 source',\n    'canonicalized: KVL mesh equations',\n    'solved: mesh analysis (sympy 1.13)',\n    'checked: numeric sweep × 200 samples',\n    'verified: node voltages match ± 0ε',\n    'emitting: animation trace · 14 keyframes'\n  ];\n  PIPE = ['Selection → Parse', 'Solve (deterministic)', 'Verify ✓', 'Animate + Teach'];\n  POOL = [\n    { t: 'predicted 4.8 V at checkpoint 2 — sign-convention misconception flagged', f: 1 },\n    { t: 'explored base slider 1.5 → 9.2 — exponent-growth intuition confirmed' },\n    { t: 'hesitated 11 s before checkpoint 1 — pacing flag for review', f: 1 },\n    { t: 'replayed step 2 animation × 3 — added to warm-up set' },\n    { t: 'correct first try at checkpoint 3 — mastery signal logged' },\n    { t: 'requested worked hint on step 4 — hint-depth report updated' }\n  ];\n  HEAT = [\n    ['Sign conventions', [0.9, 0.55, 0.75, 0.3, 0.5, 0.2]],\n    ['Exponent rules', [0.25, 0.7, 0.4, 0.55, 0.2, 0.35]],\n    ['Unit conversion', [0.5, 0.3, 0.6, 0.45, 0.7, 0.3]],\n    ['Vector components', [0.15, 0.45, 0.3, 0.65, 0.4, 0.55]],\n    ['Sampling bias', [0.35, 0.2, 0.5, 0.25, 0.6, 0.8]]\n  ];\n  CODE = {\n    web: [\n      { t: '<scr' + 'ipt src=\"https://cdn.margin.dev/sdk.js\"><\u002Fscr' + 'ipt>' },\n      { t: '<scr' + 'ipt>' },\n      { t: '  Margin.attach(document, { key: \"pk_live_2f8a\" });', a: 1 },\n      { t: '<\u002Fscr' + 'ipt>' }\n    ],\n    ios: [\n      { t: 'import MarginKit' },\n      { t: '' },\n      { t: 'class PageView: PKCanvasView {' },\n      { t: '  override func didMoveToWindow() {' },\n      { t: '    Margin.attach(self, domain: .physics)', a: 1 },\n      { t: '  }' },\n      { t: '}' }\n    ],\n    lms: [\n      { t: '# course.yaml' },\n      { t: 'plugins:' },\n      { t: '  - margin:', a: 1 },\n      { t: '      content: ./chapters/*.pdf', a: 1 },\n      { t: '      checkpoints: teacher-review', a: 1 }\n    ]\n  };\n\n  moveStep(from, to) {\n    const n = this.state.lessonSteps.length;\n    if (to < 0 || to >= n || from === to) return;\n    this.setState(s => {\n      const a = s.lessonSteps.slice();\n      const [it] = a.splice(from, 1);\n      a.splice(to, 0, it);\n      return { lessonSteps: a, dragIdx: s.dragIdx === from ? to : s.dragIdx };\n    });\n  }\n\n  componentDidMount() {\n    this._t = 0; this._last = performance.now();\n    const loop = (now) => {\n      const dt = Math.min(0.1, (now - this._last) / 1000); this._last = now;\n      const auto = this.props.demoAutoplay ?? true;\n      const sp = (this.state.step >= 2) ? 0.085 : 0.035;\n      if (auto) this._t = (this._t + dt * sp) % 1;\n      const p = this._loop, g = this._dots;\n      if (p && g) {\n        try {\n          const L = p.getTotalLength();\n          const dots = g.children;\n          for (let i = 0; i < dots.length; i++) {\n            const pt = p.getPointAtLength(((this._t + i / dots.length) % 1) * L);\n            dots[i].setAttribute('cx', pt.x.toFixed(1));\n            dots[i].setAttribute('cy', pt.y.toFixed(1));\n          }\n        } catch (e) {}\n      }\n      this._raf = requestAnimationFrame(loop);\n    };\n    this._raf = requestAnimationFrame(loop);\n    this._int = setInterval(() => { if (this.props.demoAutoplay ?? true) this.setState(s => ({ tick: s.tick + 1 })); }, 1100);\n    this._eint = setInterval(() => { if (this.props.demoAutoplay ?? true) this.setState(s => ({ etick: s.etick + 1 })); }, 2600);\n    const t0 = performance.now(), dur = 1300;\n    const cf = (now) => {\n      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);\n      this.setState({ c1: Math.round(100 * e), c2: Math.max(1, Math.round(e)), c3: Math.round(6 * e) });\n      if (k < 1) requestAnimationFrame(cf);\n    };\n    requestAnimationFrame(cf);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this._raf); clearInterval(this._int); clearInterval(this._eint);\n  }\n\n  renderVals() {\n    const S = this.state;\n    // curve\n    const b = S.b;\n    const px = x => 20 + (x + 2.5) / 5.7 * 300;\n    const py = y => 200 - (y / 10.8) * 184;\n    const xMax = Math.min(3.2, Math.log(10.8) / Math.log(b));\n    let d = '';\n    for (let i = 0; i <= 60; i++) {\n      const x = -2.5 + (xMax + 2.5) * i / 60;\n      d += (i ? 'L' : 'M') + px(x).toFixed(1) + ',' + py(Math.pow(b, x)).toFixed(1);\n    }\n    const nearE = Math.abs(b - 2.72) < 0.045;\n    // pipeline\n    const ph = S.tick % 9;\n    const active = Math.min(ph, 3);\n    const verified = ph >= 4 && ph < 8;\n    const counts = [1, 2, 3, 4, 6, 6, 6, 6, 0][ph];\n    const nodeBase = { padding: '9px 13px', border: '1px solid #232329', borderRadius: 8, fontFamily: \"'Red Hat Mono',monospace\", fontSize: 12, background: '#0E0E12', color: '#77767F', transition: 'all .35s', whiteSpace: 'nowrap' };\n    const pipeNodes = this.PIPE.map((label, i) => {\n      let st = nodeBase;\n      if (i === active && ph < 4) st = { ...nodeBase, border: '1px solid rgba(29,233,198,.7)', color: '#EAFFF9', background: 'rgba(29,233,198,.08)', boxShadow: '0 0 20px rgba(29,233,198,.12)' };\n      else if (i < active || ph >= 4) st = { ...nodeBase, border: '1px solid #2E2E36', color: '#B9B8C0' };\n      return { label, style: st, hasArrow: i < 3 };\n    });\n    const logShown = this.LOG.slice(0, counts).map(t => ({ t }));\n    // circuit\n    const chip = { background: 'rgba(29,233,198,.08)', border: '1px solid rgba(29,233,198,.4)', color: '#1DE9C6', fontFamily: \"'Red Hat Mono',monospace\", fontSize: 13, padding: '9px 20px', borderRadius: 999, cursor: 'pointer' };\n    let p72Style = chip, p48Style = chip;\n    if (S.pred === 'right') {\n      p72Style = { ...chip, background: '#1DE9C6', color: '#06231D', fontWeight: 700 };\n      p48Style = { ...chip, opacity: 0.35, cursor: 'default' };\n    } else if (S.pred === 'wrong') {\n      p48Style = { ...chip, border: '1px solid #55555E', color: '#8A8A93', background: 'none', textDecoration: 'line-through' };\n    }\n    // authoring\n    const soc = S.soc ?? (this.props.socraticDefault ?? false);\n    const hint = S.hint ?? (this.props.hintDefault ?? 'guided');\n    const HINTS = {\n      minimal: 'Hint: one law links V, I, and R.',\n      guided: 'Hint: V = I·R — you already found I = 1.2 A.',\n      worked: 'Hint: V = 1.2 A × 6 Ω = 7.2 V.'\n    };\n    const rowBase = { display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: '#0E0E12', border: '1px solid #232329', borderRadius: 8, cursor: 'grab', userSelect: 'none' };\n    const editorItems = S.lessonSteps.map((st, i) => ({\n      label: st.label,\n      tag: st.type === 'checkpoint' ? '✦ checkpoint' : 'step',\n      tagStyle: { fontFamily: \"'Red Hat Mono',monospace\", fontSize: 10.5, marginTop: 2, color: st.type === 'checkpoint' ? '#1DE9C6' : '#55555E' },\n      style: {\n        ...rowBase,\n        border: st.type === 'checkpoint' ? '1px solid rgba(29,233,198,.45)' : '1px solid #232329',\n        background: st.type === 'checkpoint' ? 'rgba(29,233,198,.05)' : '#0E0E12',\n        opacity: S.dragIdx === i ? 0.4 : 1,\n        borderStyle: S.dragIdx === i ? 'dashed' : 'solid'\n      },\n      onDragStart: e => { this.setState({ dragIdx: i }); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', st.id); } catch (x) {} },\n      onDragOver: e => { e.preventDefault(); const dIdx = this.state.dragIdx; if (dIdx != null && dIdx !== i) this.moveStep(dIdx, i); },\n      onDrop: e => e.preventDefault(),\n      onDragEnd: () => this.setState({ dragIdx: null }),\n      up: () => this.moveStep(i, ursor: 'pointer',\n        fontFamily: \"'Red Hat Mono',monospace\", fontSize: 12.5, padding: '13px 18px',\n        color: S.tab === k ? '#EDECE6' : '#6E6E78',\n        boxShadow: S.tab === k ? 'inset 0 -2px 0 #1DE9C6' : 'none'\n      }\n    }));\n    const codeLines = this.CODE[S.tab].map(l => ({\n      t: l.t || ' ', g: l.a ? '+' : ' ',\n      gStyle: { display: 'inline-block', width: 22, textAlign: 'center', color: l.a ? '#1DE9C6' : '#3A3A44', flexShrink: 0 },\n      style: {\n        fontFamily: \"'Red Hat Mono',monospace\", fontSize: 12.5, lineHeight: 1.8, whiteSpace: 'pre',\n        padding: '0 14px 0 0',\n        background: l.a ? 'rgba(29,233,198,.07)' : 'none',\n        color: l.a ? '#D8FFF6' : '#8F8E98'\n      }\n    }));\n    // dashboard\n    const heatRows = this.HEAT.map(([label, vals], ri) => ({\n      label,\n      cells: vals.map((v, ci) => {\n        const jit = Math.max(0.04, Math.min(0.95, v + 0.06 * Math.sin(S.etick * 0.9 + ri * 1.7 + ci * 0.8)));\n        return { style: { width: 22, height: 22, borderRadius: 4, background: 'rgba(29,233,198,' + (jit * 0.8 + 0.04).toFixed(2) + ')', transition: 'background .8s' } };\n      })\n    }));\n    const feedItems = [];\n    for (let k = 0; k < 4; k++) {\n      const n = S.etick - k;\n      if (n < 0) break;\n      const ev = this.POOL[((n % 6) + 6) % 6];\n      const total = 41 * 60 + 7 + n * 13;\n      const mm = Math.floor(total / 60) % 60, ss = total % 60, hh = 9 + Math.floor(total / 3600);\n      feedItems.push({\n        t: ev.t,\n        time: String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'),\n        style: {\n          display: 'flex', gap: 10, alignItems: 'baseline',\n          borderLeft: ev.f ? '2px solid #1DE9C6' : '2px solid #232329',\n          paddingLeft: 10,\n          animation: k === 0 ? 'fadeUp .4s ease both' : 'none'\n        }\n      });\n    }\n    // faq\n    const fq = i => S.faq === i;\n    const tg = i => () => this.setState(s => ({ faq: s.faq === i ? -1 : i }));\n    return {\n      c1: S.c1, c2: S.c2, c3: S.c3,\n      bVal: b, eqLabel: 'y = ' + (nearE ? 'e' : b.toFixed(1).replace(/\\.0$/, '')) + 'ˣ', bReadout: nearE ? 'e ≈ 2.72' : b.toFixed(2),\n      curveD: d, py1: py(1).toFixed(1), pointLabelY: (py(1) - 8).toFixed(1),\n      setB: e => this.setState({ b: parseFloat(e.target.value) }),\n      loopRef: el => { this._loop = el; }, dotsRef: el => { this._dots = el; },\n      s1active: S.step === 1, s2on: S.step >= 2, s2active: S.step === 2, s3on: S.step >= 3,\n      r2Stroke: S.step >= 3 ? '#1DE9C6' : '#3A3A44', r2Width: S.step >= 3 ? 3 : 2,\n      predRight: S.pred === 'right', predWrong: S.pred === 'wrong',\n      p72Style, p48Style,\n      ck1: () => this.setState({ step: 2 }),\n      predict72: () => { if (this.state.pred !== 'right') this.setState({ pred: 'right' }); },\n      predict48: () => { if (this.state.pred !== 'right') this.setState({ pred: 'wrong' }); },\n      toStep3: () => this.setState({ step: 3 }),\n      resetCircuit: () => this.setState({ step: 1, pred: null }),\n      pipeNodes, verified, logShown,\n      editorItems, previewItems, socToggle: () => this.setState({ soc: !soc }), socTrack, socKnob, hintOpts,\n      tabs, codeLines,\n      heatRows, feedItems,\n      fq0: fq(0), fq1: fq(1), fq2: fq(2), fq3: fq(3), fq4: fq(4),\n      tg0: tg(0), tg1: tg(1), tg2: tg(2), tg3: tg(3), tg4: tg(4),\n      ic0: fq(0) ? '−' : '+', ic1: fq(1) ? '−' : '+', ic2: fq(2) ? '−' : '+', ic3: fq(3) ? '−' : '+', ic4: fq(4) ? '−' : '+'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
